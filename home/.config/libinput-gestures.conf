# --- 4 Fingers: Workspaces ---
# Use internal command instead of xdotool for cleaner switching
gesture swipe left 4 _internal ws_up
gesture swipe right 4 _internal ws_down

# --- 3 Fingers Up: Overview ---
# Ensure we run the internal Skippy command, not a new instance
gesture swipe up 3 skippy-xd

# --- 3 Fingers Down: Show Desktop ---
# Using wmctrl is often more reliable than xdotool for this specific action
gesture swipe down 3 wmctrl -k on

# --- 3 Fingers Left/Right: App Switching ---
# Add a tiny delay so the Alt key registers
gesture swipe left 3 xdotool key --delay 100 Alt+Tab
gesture swipe right 3 xdotool key --delay 100 Alt+Shift+Tab
